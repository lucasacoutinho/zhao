name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Bend
        run: make setup
      - name: Check proofs, CLI behavior, and package
        run: make cli-check native-cli-check package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhao-source
          path: .build/zhao-*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install Bend
        run: make setup
      - name: Publish source package to Bendhub
        run: make package publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          {
            printf 'Zhao %s for Bend %s.\n\n' "$version" "$(cat .bend-version)"
            printf 'Import the immutable Bendhub package:\n\n```bend\n'
            cat .build/BENDHUB_IMPORT
            printf '```\n\nThe package contains only src/ modules, including its laws and proofs.\n'
            printf 'This bootstrap release has no Best dependency.\n'
          } > .build/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            ".build/zhao-$version.tar.gz" .build/BENDHUB_IMPORT \
            --verify-tag --title "Zhao $version" --notes-file .build/release-notes.md
          cat .build/release-notes.md >> "$GITHUB_STEP_SUMMARY"
